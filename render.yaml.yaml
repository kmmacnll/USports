services:
  # 1. PostgreSQL Database
  - type: postgres
    name: usports-fantasy-db
    plan: starter
    databaseName: usports_fantasy
    user: usports_admin

  # 2. Node.js Express API Server
  - type: web
    name: usports-fantasy-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usports-fantasy-db
          property: connectionString
      - key: PORT
        value: 10000

  # 3. Python Scraper Cron Job (Runs every night at 2 AM)
  - type: cron
    name: usportspy-daily-ingest
    env: python
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python data_pipeline/ingest_usports.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usports-fantasy-db
          property: connectionString
# VarsityHQ on Render: Postgres + API + web app + ingestion cron jobs.
# Step-by-step guide: docs/deploy-render.md
#
# Field and plan names follow Render's Blueprint spec as of 2025. They could
# not be checked against Render's current docs from the environment this was
# written in. Render validates this file when you create the Blueprint; if it
# rejects a value (most likely a plan name), change it there.

databases:
  # Only fields that can safely be (re)applied to an EXISTING database are set
  # here. databaseName, user and postgresMajorVersion can never change after
  # creation, so declaring values that differ from the live database (yours
  # is named varsityhq_db) makes every Blueprint sync fail. A failed sync
  # leaves the services' DATABASE_URL and start command stale. ipAllowList is
  # left to the dashboard (Networking), so a sync can't silently block
  # external connections.
  - name: varsityhq-db
    plan: basic-256mb          # keep in step with the plan shown on varsityhq-db
    region: virginia           # ALL resources must share the database's region: its internal
                               # dpg-… hostname only resolves within that region (ENOTFOUND otherwise)

services:
  # ------------------------------------------------------------ REST API
  - type: web
    name: varsityhq-api
    runtime: node
    region: virginia
    plan: starter
    branch: main
    autoDeploy: true           # deploy on every push to main
    buildCommand: cd backend && npm ci --include=dev && npm run build
    # The server opens its port immediately, then runs migrations + seeds
    # (MIGRATE_ON_START). It answers 503 until they finish, so Render's port
    # scan succeeds even while it waits (up to 3 min) for the database, and
    # traffic only arrives once /healthz is 200. If a migration fails, the
    # process exits and Render keeps the previous version live. An advisory
    # lock stops multiple instances migrating at once.
    startCommand: cd backend && npm start
    healthCheckPath: /healthz
    buildFilter:
      paths: [backend/**, db/**]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: LOG_LEVEL
        value: info
      - key: MIGRATE_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString
      # Signs the API's own tokens (email sign-up/sign-in, npm run token).
      - key: JWT_SECRET
        generateValue: true
      # Real sign-in (e.g. Sign in with Apple); see the guide, step 8.
      - key: JWT_JWKS_URL
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      # Optional escape hatch: if the internal hostname can't be resolved (e.g.
      # the database is in another region), set this to the External Database
      # URL with ?sslmode=require. Leave blank normally.
      - key: MIGRATE_DATABASE_URL
        sync: false

  # ------------------------------------------------------------ Web app
  - type: web
    name: varsityhq-web
    runtime: node
    region: virginia
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: cd web && npm ci --include=dev && npm run build
    startCommand: cd web && npm start        # next start listens on $PORT
    healthCheckPath: /api/health
    buildFilter:
      paths: [web/**]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # host:port of the API on Render's private network. The web app calls
      # the API server-side only, so the API never needs CORS.
      - key: API_HOSTPORT
        fromService:
          type: web
          name: varsityhq-api
          property: hostport

  # ------------------------------------- stats ingestion, daily at 2 AM
  - type: cron
    name: varsityhq-ingest
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 7 * * *"      # Render cron is UTC: 07:00 UTC = 2 AM EST (3 AM during EDT)
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: cd pipeline && python ingest_usports.py --sport all --no-season-check
    buildFilter:
      paths: [pipeline/**]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString

  # -------------------------------------- roster scrape, weekly (Mon)
  # Separate job so a roster-page problem can never roll back a stats run.
  - type: cron
    name: varsityhq-rosters
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "30 7 * * 1"     # Mondays 07:30 UTC = 2:30 AM EST
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: cd pipeline && python ingest_usports.py --sport all --rosters --skip-stats --no-season-check
    buildFilter:
      paths: [pipeline/**]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString

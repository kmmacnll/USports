# VarsityHQ on Render: Postgres + API + web app + ingestion cron jobs.
# Step-by-step guide: docs/deploy-render.md
#
# Field and plan names follow Render's Blueprint spec as of 2025. They could
# not be checked against Render's current docs from the environment this was
# written in. Render validates this file when you create the Blueprint; if it
# rejects a value (most likely a plan name), change it there.

databases:
  - name: varsityhq-db
    databaseName: varsityhq
    user: varsityhq
    plan: basic-256mb          # paid: the free plan expires
    region: ohio               # closest Render region to Ontario/Quebec
    postgresMajorVersion: "16"
    ipAllowList: []            # private network only; add your IP to connect from a laptop

services:
  # ------------------------------------------------------------ REST API
  - type: web
    name: varsityhq-api
    runtime: node
    region: ohio
    plan: starter
    branch: main
    autoDeploy: true           # deploy on every push to main
    buildCommand: cd backend && npm ci --include=dev && npm run build
    # Migrations + seeds run at start, not as a pre-deploy command: the running
    # service is guaranteed private-network access to the database (internal
    # dpg-… hostname), and the runner waits up to 3 min for a database that is
    # still provisioning. If a migration fails, the instance never becomes
    # healthy and Render keeps the previous version live. An advisory lock
    # stops multiple instances migrating at once.
    startCommand: cd backend && npm run migrate && npm start
    healthCheckPath: /healthz
    buildFilter:
      paths: [backend/**, db/**]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString
      # HS256 signing secret for test tokens until real sign-in exists.
      - key: JWT_SECRET
        generateValue: true
      # Real sign-in (e.g. Sign in with Apple); see the guide, step 8.
      - key: JWT_JWKS_URL
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      # Optional escape hatch: if the internal hostname can't be resolved (e.g.
      # the database is in another region), set this to the External Database
      # URL with ?sslmode=require. Leave blank normally.
      - key: MIGRATE_DATABASE_URL
        sync: false

  # ------------------------------------------------------------ Web app
  - type: web
    name: varsityhq-web
    runtime: node
    region: ohio
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: cd web && npm ci --include=dev && npm run build
    startCommand: cd web && npm start        # next start listens on $PORT
    healthCheckPath: /api/health
    buildFilter:
      paths: [web/**]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # host:port of the API on Render's private network. The web app calls
      # the API server-side only, so the API never needs CORS.
      - key: API_HOSTPORT
        fromService:
          type: web
          name: varsityhq-api
          property: hostport

  # ------------------------------------- stats ingestion, daily at 2 AM
  - type: cron
    name: varsityhq-ingest
    runtime: python
    region: ohio
    plan: starter
    branch: main
    schedule: "0 7 * * *"      # Render cron is UTC: 07:00 UTC = 2 AM EST (3 AM during EDT)
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: cd pipeline && python ingest_usports.py --sport all --no-season-check
    buildFilter:
      paths: [pipeline/**]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString

  # -------------------------------------- roster scrape, weekly (Mon)
  # Separate job so a roster-page problem can never roll back a stats run.
  - type: cron
    name: varsityhq-rosters
    runtime: python
    region: ohio
    plan: starter
    branch: main
    schedule: "30 7 * * 1"     # Mondays 07:30 UTC = 2:30 AM EST
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: cd pipeline && python ingest_usports.py --sport all --rosters --skip-stats --no-season-check
    buildFilter:
      paths: [pipeline/**]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: varsityhq-db
          property: connectionString

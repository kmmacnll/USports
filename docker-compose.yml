services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: usports
      POSTGRES_PASSWORD: usports
      POSTGRES_DB: usports_fantasy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usports -d usports_fantasy"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
